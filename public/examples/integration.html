<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgentProof SDK integration example</title>
    <script src="/agentproof-sdk.js"></script>
  </head>
  <body>
    <h1>AgentProof embed example</h1>
    <p>
      This page demonstrates the Phase 7 browser SDK. Prefer verifying on your
      server in production.
    </p>
    <button id="run">Run challenge issue</button>
    <pre id="out"></pre>
    <script>
      document.getElementById("run").onclick = async () => {
        const ap = AgentProof.create({ baseUrl: window.location.origin });
        const issued = await ap.createChallenge({ difficulty: 1, environment: "test" });
        document.getElementById("out").textContent = JSON.stringify(issued, null, 2);
      };
    </script>
  </body>
</html>
